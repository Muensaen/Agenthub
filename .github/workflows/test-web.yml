name: Test Web

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_RETENTION_DAYS: 14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run web tests
        run: npm run test:web:smoke

      - name: Build artifact suffix
        id: artifact_suffix
        if: always()
        run: |
          echo "value=run${{ github.run_number }}-${{ github.run_id }}-$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Upload Playwright HTML report (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke-${{ steps.artifact_suffix.outputs.value }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload Playwright raw results (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-smoke-${{ steps.artifact_suffix.outputs.value }}
          path: test-results/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  full:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARTIFACT_RETENTION_DAYS: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run web tests
        run: npm run test:web

      - name: Build artifact suffix
        id: artifact_suffix
        if: always()
        run: |
          echo "value=run${{ github.run_number }}-${{ github.run_id }}-$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Upload Playwright HTML report (full)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full-${{ steps.artifact_suffix.outputs.value }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload Playwright raw results (full)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-full-${{ steps.artifact_suffix.outputs.value }}
          path: test-results/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  pr-summary:
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [smoke, full]
    steps:
      - name: Comment PR summary
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const prNumber = context.issue.number;
            const smokeResult = '${{ needs.smoke.result }}';
            const fullResult = '${{ needs.full.result }}';

            const artifactsResp = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });

            const artifactNames = artifactsResp.data.artifacts.map(a => `- ${a.name}`).join('\n') || '- (none)';
            const artifactLinks = artifactsResp.data.artifacts
              .map(a => `- [${a.name}](${a.archive_download_url})`)
              .join('\n') || '- (none)';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            const artifactsUrl = `${runUrl}#artifacts`;
            const emoji = (smokeResult === 'success' && fullResult === 'success') ? '✅' : '❌';
            const passed = smokeResult === 'success' && fullResult === 'success';

            const body = [
              '<!-- agenthub-test-web-summary -->',
              `## ${emoji} Test Web Summary`,
              '',
              `- Smoke: **${smokeResult}**`,
              `- Full: **${fullResult}**`,
              `- Run: [#${context.runNumber}](${runUrl})`,
              `- Artifacts: [Open artifacts](${artifactsUrl})`,
              '',
              '### Artifacts (Names)',
              artifactNames,
              '',
              '### Artifacts (Direct Download)',
              artifactLinks,
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.data.find(c => c.body && c.body.includes('<!-- agenthub-test-web-summary -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }

            const labelsToAdd = passed ? ['ci-passed'] : ['ci-failed'];
            const labelsToRemove = passed ? ['ci-failed'] : ['ci-passed'];

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } else {
                  throw error;
                }
              }
            };

            try {
              await ensureLabel('ci-passed', '1f883d', 'PR checks passed (smoke/full)');
              await ensureLabel('ci-failed', 'b60205', 'PR checks failed (smoke/full)');
            } catch (error) {
              core.warning(`Could not ensure labels exist: ${error.message}`);
            }

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: labelsToAdd,
              });
            } catch (error) {
              core.warning(`Could not add labels ${labelsToAdd.join(', ')}: ${error.message}`);
            }

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: label,
                });
              } catch {
                // Ignore if label does not exist on the PR.
              }
            }
